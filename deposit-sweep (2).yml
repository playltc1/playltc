name: deposit-sweep

# Checks the deposit wallet every 5 minutes, so payments are credited even when nobody has the site open.
# Needs a repo secret named CRON_SECRET with the same value as the CRON_SECRET env var in Vercel.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep wallet
        run: |
          curl -fsS -X POST https://playltc.wtf/api/deposit \
            -H "content-type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{"action":"sweep"}'
